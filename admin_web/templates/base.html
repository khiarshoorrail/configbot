<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل ادمین — ربات کانفیگ</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: Tahoma, "Segoe UI", sans-serif; background:#f4f6fb; margin:0; color:#1f2937; }
  nav { background:#111827; padding:10px 20px; display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  nav a { color:#e5e7eb; text-decoration:none; padding:6px 12px; border-radius:8px; }
  nav a:hover, nav a.active { background:#374151; }
  .brand { color:#fff; font-weight:bold; margin-inline-end:auto; }
  main { max-width:1100px; margin:24px auto; padding:0 16px; }
  h2 { margin-top:0; }
  table { width:100%; border-collapse:collapse; background:#fff; border-radius:10px; overflow:hidden; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  th, td { padding:9px 12px; text-align:right; border-bottom:1px solid #e5e7eb; font-size:14px; }
  th { background:#f9fafb; color:#374151; white-space:nowrap; }
  tr:hover td { background:#f8fafc; }
  .card { background:#fff; border-radius:12px; padding:18px 22px; box-shadow:0 1px 3px rgba(0,0,0,.08); margin-bottom:18px; }
  .stats { display:flex; gap:14px; flex-wrap:wrap; }
  .stat { flex:1; min-width:150px; background:#fff; border-radius:12px; padding:16px; text-align:center; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .stat b { display:block; font-size:28px; color:#2563eb; }
  input, textarea, select { font-family:inherit; padding:7px 10px; border:1px solid #d1d5db; border-radius:8px; width:100%; }
  button { font-family:inherit; cursor:pointer; border:none; border-radius:8px; padding:7px 14px; font-size:13px; }
  .btn-primary { background:#2563eb; color:#fff; }
  .btn-ok { background:#16a34a; color:#fff; }
  .btn-danger { background:#dc2626; color:#fff; }
  .btn-warn { background:#d97706; color:#fff; }
  .flash { background:#dcfce7; color:#166534; border-radius:8px; padding:10px 14px; margin-bottom:14px; }
  .flash.err { background:#fee2e2; color:#991b1b; }
  code { direction:ltr; display:inline-block; background:#f3f4f6; padding:1px 6px; border-radius:5px; font-size:12px; }
  form.inline { display:inline; }
  .muted { color:#6b7280; font-size:12px; }
  textarea { min-height:90px; }
</style>
</head>
<body>
<nav>
  <span class="brand">🖥 پنل ادمین</span>
  <a href="/">آمار</a>
  <a href="/users">کاربران</a>
  <a href="/orders">سفارش‌ها</a>
  <a href="/plans">پلن‌ها</a>
  <a href="/panels">پنل‌های v2ray</a>
  {% if password_enabled %}<a href="/logout">خروج</a>{% endif %}
</nav>
<main>{% block content %}{% endblock %}</main>
</body>
</html>
