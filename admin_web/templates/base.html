<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>پنل ادمین — ربات کانفیگ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<style>
  body { background: #f4f6fb; }
  .navbar .nav-link.active { color: #fff !important; background: rgba(255,255,255,.15); border-radius: .5rem; }
  .card { border: none; }
  footer { opacity:.55; font-size:.85rem; }
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
  <div class="container">
    <a class="navbar-brand" href="/"><i class="bi bi-speedometer2"></i> پنل ادمین</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item"><a class="nav-link {{ 'active' if request.path == '/' }}" href="/"><i class="bi bi-bar-chart"></i> آمار</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.path.startswith('/users') }}" href="/users"><i class="bi bi-people"></i> کاربران</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.path.startswith('/orders') }}" href="/orders"><i class="bi bi-cart"></i> سفارش‌ها</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.path.startswith('/plans') and not request.path.startswith('/panels') }}" href="/plans"><i class="bi bi-tags"></i> پلن‌ها</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.path.startswith('/panels') }}" href="/panels"><i class="bi bi-hdd-network"></i> پنل‌ها</a></li>
        <li class="nav-item"><a class="nav-link {{ 'active' if request.path.startswith('/settings') }}" href="/settings"><i class="bi bi-gear"></i> تنظیمات</a></li>
        {% if password_enabled %}
        <li class="nav-item">
          <form method="post" action="/logout" class="d-inline">
            <input type="hidden" name="csrf" value="{{ csrf }}">
            <button class="nav-link btn btn-link text-danger" type="submit"><i class="bi bi-box-arrow-right"></i> خروج</button>
          </form>
        </li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>
<main class="container py-4">
  {% block content %}{% endblock %}
</main>
<footer class="text-center pb-3">🛰 ربات فروش کانفیگ — پنل ادمین</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
