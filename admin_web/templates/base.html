<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}پنل ادمین{% endblock %} — ربات کانفیگ</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛰</text></svg>">
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet">
<style>
  :root {
    --bg: #eef1f7;
    --sidebar-bg: #141b2d;
    --sidebar-active: #2b3a5c;
    --accent: #4f6ef7;
    --accent-soft: #eef1ff;
    --card-radius: 16px;
    --shadow: 0 2px 12px rgba(20, 27, 45, .06);
  }
  body {
    background: var(--bg);
    font-family: Vazirmatn, Tahoma, "Segoe UI", sans-serif;
    color: #232a3b;
    min-height: 100vh;
  }
  /* --- سایدبار --- */
  .sidebar {
    position: fixed;
    inset-block: 0;
    right: 0;
    width: 240px;
    background: linear-gradient(180deg, #141b2d 0%, #1a2337 100%);
    color: #aab3c8;
    padding: 18px 14px;
    display: flex;
    flex-direction: column;
    z-index: 1030;
  }
  .sidebar .brand {
    color: #fff;
    font-weight: 800;
    font-size: 1.05rem;
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: .6rem;
    padding: 10px 12px 22px;
  }
  .sidebar .brand i { color: var(--accent); font-size: 1.4rem; }
  .sidebar .nav-label {
    font-size: .72rem;
    letter-spacing: .08em;
    color: #5d6a85;
    padding: 0 12px 6px;
  }
  .sidebar a.nav-item,
  .sidebar button.logout-btn {
    display: flex;
    align-items: center;
    gap: .65rem;
    color: #aab3c8;
    text-decoration: none;
    padding: 10px 12px;
    border-radius: 10px;
    margin-bottom: 4px;
    border: none;
    background: none;
    width: 100%;
    text-align: right;
    font-size: .95rem;
    transition: all .15s ease;
  }
  .sidebar a.nav-item:hover,
  .sidebar button.logout-btn:hover { background: rgba(255,255,255,.05); color: #fff; }
  .sidebar a.nav-item.active {
    background: var(--sidebar-active);
    color: #fff;
    box-shadow: inset 3px 0 0 var(--accent);
  }
  .sidebar a.nav-item i { font-size: 1.1rem; width: 1.35rem; text-align: center; }
  .sidebar a.nav-item.active i { color: #93a8ff; }
  .sidebar .mt-auto { margin-top: auto; }
  main.content {
    /* سایدبار فیزیکی سمت راست است؛ در RTL باید مارجین سمت راست داده شود */
    margin-right: 240px;
    padding: 28px 32px 40px;
    max-width: 1200px;
  }
  /* --- کارت‌ها و اجزا --- */
  .card {
    border: none;
    border-radius: var(--card-radius);
    box-shadow: var(--shadow);
  }
  .card-header {
    background: #fff;
    border-bottom: 1px solid #edf0f6;
    border-radius: var(--card-radius) var(--card-radius) 0 0 !important;
    font-weight: 700;
    padding: .9rem 1.25rem;
  }
  .stat-card {
    border-radius: var(--card-radius);
    padding: 20px;
    color: #fff;
    position: relative;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .stat-card .icon {
    position: absolute;
    left: 16px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 2.6rem;
    opacity: .25;
  }
  .stat-card h2 { font-size: 2rem; font-weight: 800; margin-bottom: 2px; }
  .stat-card small { opacity: .85; }
  .stat-blue   { background: linear-gradient(135deg, #4f6ef7, #6c88ff); }
  .stat-green  { background: linear-gradient(135deg, #21a567, #35c98a); }
  .stat-teal   { background: linear-gradient(135deg, #0ea5b7, #2bc5d8); }
  .stat-orange { background: linear-gradient(135deg, #e8892b, #f2a94f); }
  table { --bs-table-hover-bg: #f7f8fd; }
  thead th {
    color: #7c869e;
    font-size: .78rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .04em;
    border-bottom: none !important;
    background: #fafbfe;
  }
  td { vertical-align: middle !important; }
  .btn { border-radius: 10px; font-weight: 600; }
  .form-control, .form-select { border-radius: 10px; border-color: #dde3ef; }
  .form-control:focus, .form-select:focus { border-color: var(--accent); box-shadow: 0 0 0 .2rem rgba(79,110,247,.15); }
  .badge { border-radius: 8px; font-weight: 600; }
  code { background: var(--accent-soft); color: #3d55c9; border-radius: 6px; padding: 2px 7px; font-size: .82em; }
  .page-title { font-weight: 800; font-size: 1.35rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: .55rem; }
  .page-title i { color: var(--accent); }
  footer.footer {
    margin-right: 240px;
    text-align: center;
    padding: 14px 0 20px;
    color: #9aa3b8;
    font-size: .82rem;
  }
  @media (max-width: 991.98px) {
    .sidebar {
      position: static;
      width: auto;
      inset-inline: 0;
      flex-direction: row;
      flex-wrap: wrap;
      align-items: center;
      gap: 4px;
      padding: 10px;
    }
    .sidebar .brand { padding: 4px 10px; width: 100%; }
    .sidebar .nav-label { display: none; }
    .sidebar a.nav-item, .sidebar button.logout-btn { width: auto; margin-bottom: 0; padding: 8px 12px; }
    .sidebar .mt-auto { margin-top: 0; margin-inline-start: auto; width: auto !important; }
    main.content, footer.footer { margin-right: 0 !important; padding-inline: 16px; }
  }
</style>
</head>
<body>
<aside class="sidebar">
  <a class="brand" href="/"><i class="bi bi-broadcast-pin"></i> پنل ادمین</a>

  <div class="nav-label">مدیریت</div>
  <a class="nav-item {{ 'active' if request.path == '/' }}" href="/"><i class="bi bi-grid-1x2"></i> داشبورد</a>
  <a class="nav-item {{ 'active' if request.path.startswith('/users') }}" href="/users"><i class="bi bi-people"></i> کاربران</a>
  <a class="nav-item {{ 'active' if request.path.startswith('/orders') }}" href="/orders"><i class="bi bi-cart3"></i> سفارش‌ها</a>

  <div class="nav-label pt-3">فروشگاه</div>
  <a class="nav-item {{ 'active' if request.path.startswith('/plans') and not request.path.startswith('/panels') }}" href="/plans"><i class="bi bi-tags"></i> پلن‌ها</a>
  <a class="nav-item {{ 'active' if request.path.startswith('/panels') }}" href="/panels"><i class="bi bi-hdd-network"></i> پنل‌های v2ray</a>
  <a class="nav-item {{ 'active' if request.path.startswith('/settings') }}" href="/settings"><i class="bi bi-sliders"></i> تنظیمات</a>

  <div class="mt-auto">
    {% if password_enabled %}
    <form method="post" action="/logout">
      <input type="hidden" name="csrf" value="{{ csrf }}">
      <button class="logout-btn text-danger" type="submit"><i class="bi bi-box-arrow-left"></i> خروج</button>
    </form>
    {% endif %}
  </div>
</aside>

<main class="content">
  {% block content %}{% endblock %}
</main>
<footer class="footer">🛰 ربات فروش کانفیگ v2ray — پنل ادمین</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
