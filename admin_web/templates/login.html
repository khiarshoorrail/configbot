{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-4">
    <div class="card shadow">
      <div class="card-body">
        <h4 class="card-title text-center mb-3"><i class="bi bi-shield-lock"></i> ورود ادمین</h4>
        {% if error %}<div class="alert alert-danger">{{ error }}</div>{% endif %}
        <form method="post" action="/login">
          <div class="mb-3">
            <input type="password" name="password" class="form-control" placeholder="رمز عبور" autofocus required>
          </div>
          <button type="submit" class="btn btn-primary w-100">ورود</button>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
